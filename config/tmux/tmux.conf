# ==============================================================================
# config/tmux/tmux.conf — Configuracao conservadora para tmux (terminal-setup)
# Regra (Secao 10 do guia): sem baixar plugins (TPM) e sem executar comandos
# externos pesados ou de rede ao iniciar.
# ==============================================================================

# Suporte a cores 256/truecolor
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Indice de janelas e paineis iniciando em 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Historico de scrollback moderado e tempo de resposta de tecla Escape
set -g history-limit 20000
set -sg escape-time 10
set -g focus-events on

# Habilitar suporte a mouse (scroll e selecao de painel)
set -g mouse on

# Dividir paineis preservando o diretorio atual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Recarregar configuracao manualmente com prefixo + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf recarregado"

# Barra de status simples em texto puro (sem exigir Nerd Font nem comandos externos)
set -g status-position bottom
set -g status-interval 15
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "[#S] "
set -g status-left-length 30
set -g status-right "%Y-%m-%d %H:%M "
set -g status-right-length 40

