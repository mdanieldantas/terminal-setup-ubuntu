# Perfil server — terminal-setup (Ubuntu 24.04 LTS amd64)
# Formato restrito CHAVE=valor. Nao executado via source.
PROFILE_NAME=server
PROFILE_DESCRIPTION=Ambiente para operacao em servidores Ubuntu com btop, tmux, fd, zoxide e plugins Zsh conservadores (sem alterar servicos)
REQUIRED_COMPONENTS=zsh,git,nano,ca-certificates,curl,jq,starship,fzf,ripgrep,bat,fd,tmux,zoxide,btop,zsh-autosuggestions,zsh-history-substring-search
OPTIONAL_COMPONENTS=eza,superfile,zsh-syntax-highlighting,zsh-vi-mode
DEFAULT_ICONS=plain
DEFAULT_VI_MODE=false

