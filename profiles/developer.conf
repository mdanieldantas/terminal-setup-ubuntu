# Perfil developer — terminal-setup (Ubuntu 24.04 LTS amd64)
# Formato restrito CHAVE=valor. Nao executado via source.
PROFILE_NAME=developer
PROFILE_DESCRIPTION=Ambiente de desenvolvimento interativo com fd, tmux, zoxide, eza, Superfile e plugins Zsh
REQUIRED_COMPONENTS=zsh,git,nano,ca-certificates,curl,jq,starship,fzf,ripgrep,bat,fd,tmux,zoxide,eza,superfile,zsh-autosuggestions,zsh-history-substring-search,zsh-syntax-highlighting
OPTIONAL_COMPONENTS=btop,zsh-vi-mode
DEFAULT_ICONS=plain
DEFAULT_VI_MODE=false

